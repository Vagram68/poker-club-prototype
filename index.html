<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6eedd">
<meta property="og:title" content="POKER CLUB — приложение игрока">
<meta property="og:description" content="Кликабельный прототип">
<meta property="og:type" content="website">
<meta name="description" content="Кликабельный прототип">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23f6eedd'/%3E%3Cpath d='M24 4 44 24 24 44 4 24Z' fill='none' stroke='%23561a1b' stroke-width='2.4'/%3E%3Ctext x='24' y='31' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23561a1b'%3EP%3C/text%3E%3C/svg%3E">
<title>POKER CLUB — приложение игрока</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper-50:#fffaf0;--paper-100:#f6eedd;--paper-200:#f8e9d2;--paper-300:#e9d9bd;--paper-400:#cdbfa9;
  --bg-tertiary:#eadcc4;--bg-inset:#e6d6bc;
  --ink:#2b1012;--text-2:#65554f;--text-3:#6e5d57;
  --burgundy:#561a1b;--wine:#851c2d;--red:#982020;
  --wine-950:#190a0c;--wine-900:#230d10;--wine-800:#35131a;
  --border:rgba(86,26,27,.18);--border-soft:rgba(86,26,27,.10);
  --success:#4f9a6c;--gold:#c99a3c;--silver:#9aa0a6;--bronze:#b0703c;--bounty:#b394cc;
  --shadow:0 8px 24px rgba(43,16,18,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Onest',system-ui,-apple-system,sans-serif;color:var(--ink);background:#1b0f10;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.phone{position:relative;width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:
  radial-gradient(120% 40% at 70% 0%,#fffaf0 0%,rgba(255,250,240,0) 70%),
  linear-gradient(180deg,#f6eedd 0%,#f3e8d1 100%);overflow-x:hidden;box-shadow:0 0 80px rgba(0,0,0,.5)}
@media(min-width:500px){body{padding:0}.phone{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 80px rgba(0,0,0,.6)}}
/* header */
.hdr{position:sticky;top:0;z-index:30;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(246,238,221,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft)}
.logo{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--burgundy)}
.logo span{font-size:6.5px;letter-spacing:.18em;font-weight:600}
.hdr-r{display:flex;align-items:center;gap:20px}
.bell{position:relative;width:28px;height:28px;display:grid;place-items:center;color:var(--burgundy)}
.bell i{position:absolute;top:2px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--wine);border:2px solid var(--paper-100)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;overflow:hidden;letter-spacing:0}
.av.me{background:linear-gradient(135deg,#7d5a3c,#4b3326)}
/* layout */
.page{padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.pad-top{padding-top:22px}
h1.t{font-size:33px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--text-2);font-size:14px;margin-top:8px}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--wine);text-transform:uppercase}
h2.s{font-size:22px;font-weight:700;letter-spacing:-.01em}
.card{background:linear-gradient(180deg,#fbf2de,#f7e9d0);border:1px solid rgba(86,26,27,.13);border-radius:24px;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);margin:22px 0 18px}
.back u{text-underline-offset:3px;text-decoration-thickness:1.5px}
/* live card */
.live{position:relative;margin-top:24px;border-radius:24px;padding:18px 16px 14px;color:#f6eedd;overflow:hidden;background:linear-gradient(145deg,#6a1f23 0%,#521719 50%,#3d1014 100%);box-shadow:0 14px 30px rgba(58,16,19,.35)}
.live::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 42%,rgba(255,255,255,.02) 52%,transparent 60%);pointer-events:none}
.live-top{position:relative;display:flex;justify-content:space-between;gap:10px}
.live h3{font-size:29px;font-weight:500;line-height:1.08;text-transform:uppercase;letter-spacing:-.005em;max-width:200px;overflow-wrap:normal}
.live .open{font-size:13px;opacity:.78;margin-top:12px;max-width:130px;line-height:1.3}
.live-r{text-align:right;padding-top:2px;flex:none}
.live-r .lv{font-size:12px;letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.live-r .tm{font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.live-r .bl{font-size:11.5px;opacity:.78;margin-top:2px;white-space:nowrap}
.live-bot{position:relative;margin-top:16px;padding-top:12px;border-top:1px dashed rgba(246,238,221,.28);display:flex;align-items:center;justify-content:space-between}
.live-bot .pl{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.85}
.btn-light{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#fbf0da,#efdcb8);color:var(--ink);font-weight:700;font-size:14px;border-radius:14px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.live.idle{background:linear-gradient(145deg,#4a2a2c,#2e1618)}
/* timeline */
.sec-h{margin:34px 2px 6px}
.tl{list-style:none;margin:6px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:22px;bottom:22px;width:1.5px;background:rgba(86,26,27,.22)}
.tl li{position:relative;display:flex;align-items:center;gap:14px;height:62px;padding:0 4px}
.tl .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--burgundy);background:var(--paper-100);flex:none;margin-left:4px;position:relative;z-index:1}
.tl li:first-child .dot{background:var(--wine);border-color:var(--wine);box-shadow:0 0 0 5px rgba(133,28,45,.15)}
.tl .tx{flex:1;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tt{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums}
/* rating dark card */
.rcard{position:relative;margin-top:26px;border-radius:24px;padding:22px 20px 18px;color:#f6eedd;overflow:hidden;background:linear-gradient(150deg,#5a1a1e,#3a1013);box-shadow:0 14px 30px rgba(58,16,19,.3);min-height:230px}
.rcard svg.deco{position:absolute;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
.rcard>*:not(svg){position:relative}
.rcard .l1{font-size:13px;opacity:.85;max-width:190px;line-height:1.3}
.rcard .big{font-size:58px;font-weight:700;line-height:1;margin-top:10px}
.rcard .l2{font-size:14px;font-weight:600;margin-top:2px}
.rcard .l3{font-size:13px;opacity:.75;margin-top:8px;max-width:190px;line-height:1.35}
.rcard a{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-weight:600;font-size:15px}
.cta{display:flex;align-items:center;gap:16px;width:100%;height:76px;margin-top:14px;padding:0 22px;border-radius:20px;background:linear-gradient(180deg,#8d1f31,#7c1a2a);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 22px rgba(133,28,45,.3);text-align:left}
.cta .g{flex:1}
/* news */
.news{margin-top:14px;overflow:hidden;border-radius:24px}
.news .img{height:210px;position:relative;overflow:hidden}
.news .bd{padding:20px 18px 22px}
.news .dt{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--wine);text-transform:uppercase}
.news h3{font-size:24px;font-weight:500;margin-top:12px;line-height:1.2}
.news p{font-size:15px;color:var(--text-2);margin-top:12px;line-height:1.45}
/* registered status */
.regcard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 14px 14px 16px;border-radius:20px;background:linear-gradient(180deg,#fbf2de,#f4e3c4);border:1px solid rgba(86,26,27,.2)}
.regcard .ok{width:36px;height:36px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;flex:none}
.regcard .m{flex:1;min-width:0}.regcard b{display:block;font-size:15px}.regcard small{color:var(--text-2);font-size:13px}
.btn-sm{background:var(--burgundy);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:14px}
/* tournaments */
.tops{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:linear-gradient(#fbf0da,#f3e1c0);border:1.5px solid rgba(86,26,27,.3);font-weight:700;font-size:13.5px;box-shadow:0 4px 10px rgba(43,16,18,.07);color:var(--ink);white-space:nowrap}
.tcard{display:block;margin-bottom:14px;overflow:hidden;cursor:pointer;position:relative}
.cover{position:relative;overflow:hidden;background:#3a1013;color:#f6eedd}
.cover .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:400;text-transform:uppercase;line-height:1.02;letter-spacing:.01em}
.cover .mono{position:absolute;right:14px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:7px;letter-spacing:.2em;color:#f6eedd}
.cnt{position:absolute;top:14px;right:14px;background:#fbf3df;color:var(--ink);border-radius:16px;padding:7px 12px 6px;text-align:center;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.cnt b{display:block;font-size:15.5px;font-weight:700;line-height:1.1}.cnt small{font-size:10.5px;color:var(--text-2);font-weight:500}
.tw .cover{height:170px}.tw .cover .ct{font-size:44px}
.tbody{padding:20px 16px 16px}
.chip{display:inline-block;padding:11px 16px;border-radius:999px;background:var(--bg-inset);font-size:12px;font-weight:600;color:var(--text-2)}
.chip.open{background:#ebd9bb;color:#6b4a2c}.chip.reg{background:#d9e9d9;color:#2e6a45}
.tname{font-size:24px;font-weight:700;text-transform:uppercase;line-height:1.1;margin-top:16px;letter-spacing:-.005em;word-break:break-word}
.tdate{font-size:15.5px;font-weight:700;color:var(--wine);margin-top:10px}
.tdesc{font-size:14px;color:var(--text-2);line-height:1.45;margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tmeta{font-size:12.5px;color:var(--text-2);margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:linear-gradient(180deg,#8d1f31,#7a1a2a);color:#fff;font-weight:600;font-size:16px;margin-top:16px;box-shadow:0 6px 14px rgba(133,28,45,.25)}
.btn.dis{background:#b0605c;box-shadow:none;cursor:default;opacity:.95}
.btn.line{background:transparent;color:var(--burgundy);border:1.5px solid var(--burgundy);box-shadow:none}
.btn.dark{background:var(--burgundy)}
.btn.dis-soft{background:#e1cfc0;color:#9b8478;box-shadow:none}
.th{display:flex}
.th>div:first-child .cover{position:absolute;inset:0}
.th .cover .ct{font-size:27px;left:0;right:0;padding:0 8px}
.th .cnt{left:14px;right:auto;top:14px;padding:6px 11px 5px}
.th .tbody{padding:16px 14px 14px;flex:1;min-width:0}
.th .tname{font-size:22px;margin-top:14px}
.th .btn{height:48px;font-size:15.5px}
.th .chip{padding:10px 14px}
/* hero */
.hero{position:relative;height:280px;border-radius:28px;overflow:hidden;color:#f6eedd;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 20px 18px;background:#190a0c}
.hero.sm{height:172px;padding:18px 20px 16px}
.hero .ek{font-size:12px;font-weight:600;letter-spacing:.14em;color:#d9ae5c;text-transform:uppercase}
.hero h1{font-size:34px;font-weight:500;line-height:1.05;margin-top:8px;text-transform:uppercase;position:relative}
.hero.sm h1{font-size:30px}
.hero .dp{align-self:flex-start;margin-top:14px;padding:10px 16px;border-radius:999px;border:1px solid rgba(246,238,221,.3);background:rgba(25,10,12,.4);font-size:14px;font-weight:600;position:relative}
.hero .ek{position:relative}
.seg{display:flex;gap:2px;margin:16px 0;padding:4px;border-radius:20px;background:linear-gradient(#fbf2de,#f6e8cd);border:1.5px solid rgba(86,26,27,.2)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border-radius:16px;font-size:13px;font-weight:600;color:var(--text-2);line-height:1.15;text-align:left}
.seg button.on{background:linear-gradient(180deg,#8d1f31,#7a1a2a);color:#fff;box-shadow:0 6px 12px rgba(133,28,45,.3)}
.seg button.on.dk{background:linear-gradient(#651e20,#4d1618)}
.box{padding:22px 18px 20px}
.box .cap{color:var(--burgundy)}
.fmt{font-size:16px;line-height:1.5;color:#4a3732;margin-top:12px}
.addr{display:flex;align-items:center;gap:16px;margin-top:20px;padding:16px;border-radius:18px;background:var(--bg-inset);border:1px solid var(--border)}
.addr small{display:block;font-size:12px;color:var(--text-2)}.addr b{font-size:15px;line-height:1.3;display:block;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-radius:18px;background:var(--bg-inset);border:1px solid var(--border);overflow:hidden}
.facts div{padding:15px 16px;border-bottom:1px solid var(--border)}
.facts div:nth-child(odd){border-right:1px solid var(--border)}.facts div:nth-last-child(-n+2){border-bottom:0}
.facts small{display:block;font-size:12px;color:var(--text-2)}.facts b{display:block;font-size:17px;font-weight:700;margin-top:8px}
.lst{margin-top:16px;border-top:1px solid var(--border)}
.lst .row{display:flex;align-items:center;gap:12px;min-height:66px;padding:0 18px;border-bottom:1px solid var(--border);cursor:default}
.lst .row:last-child{border-bottom:0}
.box.lstbox{padding:0;overflow:hidden}
.box .hd{padding:22px 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.box .hd h2{font-size:22px;line-height:1.15;font-weight:600;margin-top:8px}
.box .hd .rt{font-size:15px;text-align:right;line-height:1.25;color:var(--ink)}
.pn{width:22px;font-size:12.5px;color:var(--text-2);flex:none}
.pr{margin-left:auto;font-weight:700;font-size:15px}.pr small{font-size:10.5px;font-weight:500;color:var(--text-2)}
.lvl{display:flex;align-items:center;gap:20px;min-height:64px;padding:0 18px;border-top:1px solid var(--border)}
.lvl .n{width:34px;font-size:21px;color:var(--wine);font-weight:400}
.lvl b{display:block;font-size:16px;font-weight:700}.lvl small{font-size:11.5px;color:var(--text-2)}
.lvl .mn{margin-left:auto;font-size:12px;color:var(--text-2)}
.lvl.br{background:rgba(86,26,27,.08)}
.lvl.cur{background:rgba(133,28,45,.1)}
/* archive */
.arch{list-style:none;margin:20px 0 0;padding:0}
.arch li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.arch .ic{width:34px;height:34px;border-radius:50%;background:var(--paper-300);display:grid;place-items:center;color:var(--burgundy);flex:none}
.arch .m{flex:1;min-width:0}.arch b{display:block;font-size:14.5px;font-weight:600;text-transform:uppercase}
.arch small{font-size:13px;color:var(--text-2);display:block;margin-top:3px}
.res{margin-top:22px;padding:22px 18px 18px}
.res h1{font-size:34px;font-weight:500;line-height:1.08;text-transform:uppercase;margin-top:12px}
.res .d{color:var(--text-2);font-size:15px;margin-top:14px}
.tbl{margin-top:22px;border-radius:22px;background:linear-gradient(#ecdec6,#e6d6bc);border:1px solid var(--border);overflow:hidden}
.tbl .hd{padding:14px 14px 12px;display:flex;justify-content:space-between;align-items:flex-end}
.tbl .hd h3{font-size:17px;font-weight:700;margin-top:4px}.tbl .hd .c{color:var(--text-2);font-size:15px}
.tbl .cap{font-size:10.5px}
.rr{display:flex;align-items:center;gap:14px;height:58px;padding:0 14px;border-top:1px solid var(--border)}
.rr .pl{width:26px;text-align:center;font-weight:600;color:var(--text-2);font-size:16px;flex:none}
.rr b{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .pts{margin-left:auto;font-weight:700;font-size:13.5px;color:var(--success)}
.rr.me{background:rgba(133,28,45,.1)}
.more{display:block;width:100%;padding:16px;font-weight:600;font-size:14px;color:var(--wine);border-top:1px solid var(--border)}
/* rating page */
.seg2{display:inline-flex;gap:2px;padding:4px;border-radius:20px;background:linear-gradient(#fbf2de,#f6e8cd);border:1.5px solid rgba(86,26,27,.2);width:62%;margin-top:22px}
.seg2 button{flex:1;padding:14px 4px;border-radius:16px;font-weight:700;font-size:15px;color:var(--text-2)}
.seg2 button.on{background:linear-gradient(#651e20,#4d1618);color:#fff;box-shadow:0 5px 12px rgba(58,16,19,.3)}
.per{display:flex;gap:2px;padding:4px;margin-top:14px;border-radius:20px;background:linear-gradient(#fbf2de,#f6e8cd);border:1.5px solid rgba(86,26,27,.2);overflow-x:auto;scrollbar-width:none}
.per::-webkit-scrollbar{display:none}
.per button{flex:1;min-width:fit-content;padding:10px 14px;border-radius:16px;text-align:left;font-weight:700;font-size:13.5px;color:var(--text-2);white-space:nowrap;line-height:1.25}
.per button small{display:block;font-size:10.5px;font-weight:500;opacity:.85}
.per button.on{background:linear-gradient(#651e20,#4d1618);color:#fff;box-shadow:0 5px 12px rgba(58,16,19,.3)}
.mine{position:relative;margin-top:14px;padding:16px 14px 18px;border-radius:22px;color:#f6eedd;background:linear-gradient(150deg,#5a1a1e,#3a1013);overflow:hidden;box-shadow:0 14px 26px rgba(58,16,19,.28)}
.mine::after{content:"";position:absolute;right:-60px;top:-30px;width:240px;height:240px;border-radius:50%;border:30px solid rgba(255,255,255,.05)}
.mine .t1{display:flex;justify-content:space-between;font-size:12px;position:relative}.mine .t1 b{font-size:12.5px}.mine .t1 span{opacity:.75;font-size:11.5px}
.mine .cols{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px;position:relative}
.mine .cols>div{padding:0 12px;border-left:1px solid rgba(246,238,221,.22)}.mine .cols>div:first-child{padding-left:2px;border:0}
.mine small{display:block;font-size:13.5px;opacity:.78}.mine .v{font-size:28px;font-weight:700;margin-top:6px;line-height:1}
.season{margin-top:16px;padding:18px 12px 8px}
.season .hd{display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px 10px}
.season .hd h2{font-size:22px;font-weight:700;margin-top:6px}.season .hd span{font-size:13px;color:var(--text-2);padding-bottom:4px}
.pr-row{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 12px;margin-bottom:8px;border-radius:20px;background:linear-gradient(#ece0c8,#e8dac0);border:1px solid var(--border-soft);cursor:pointer}
.pr-row .pl{width:44px;height:44px;border-radius:50%;background:var(--paper-200);display:grid;place-items:center;font-weight:700;color:var(--text-2);flex:none;font-size:15px}
.pr-row b{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-row .v{text-align:right}.pr-row .v strong{display:block;font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.pr-row .v small{font-size:11px;color:var(--text-2)}
.pr-row.me{outline:2px solid var(--wine)}
/* history */
.chron{margin-top:20px;padding:22px 20px;border-radius:24px;color:#f6eedd;background:linear-gradient(150deg,#5a1a1e,#3a1013);box-shadow:0 14px 28px rgba(58,16,19,.3);position:relative;overflow:hidden}
.chron .cap{color:#d9ae5c}
.chron .st{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.chron .st>div{padding:0 10px;border-left:1px solid rgba(246,238,221,.2)}.chron .st>div:first-child{padding-left:0;border:0}
.chron .v{font-size:28px;font-weight:700;line-height:1}.chron small{display:block;font-size:12px;opacity:.75;margin-top:6px;line-height:1.25}
.hrow{display:flex;align-items:center;gap:14px;padding:16px 16px;margin-top:10px;border-radius:20px;cursor:pointer}
.hrow .m{flex:1;min-width:0}.hrow b{display:block;font-size:15px;text-transform:uppercase;font-weight:600}
.hrow small{display:block;color:var(--text-2);font-size:13px;margin-top:4px}
.hrow .r{text-align:right}.hrow .r b{text-transform:none;color:var(--success);font-size:16px}
.empty{text-align:center;padding:60px 20px 20px}
.empty .ei{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:var(--paper-300);display:grid;place-items:center;color:var(--burgundy)}
.empty h3{font-size:20px;font-weight:700}.empty p{color:var(--text-2);font-size:14px;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{padding:16px;border-radius:18px;background:var(--bg-inset);border:1px solid var(--border)}
.tile.w{grid-column:span 2}.tile small{display:block;font-size:12px;color:var(--text-2)}.tile b{display:block;font-size:24px;margin-top:6px;font-weight:700}
.tile.pos b{color:var(--success)}
.kill{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.kill b{font-size:14.5px;font-weight:600}.kill span{margin-left:auto;font-size:13px;color:var(--text-2)}
/* profile */
.ph{display:flex;align-items:center;gap:14px;padding-top:22px}
.ph h1{font-size:26px;font-weight:500}.ph small{color:var(--text-2);font-size:13px}
.kc{position:relative;margin-top:22px;height:236px;border-radius:26px;background:radial-gradient(90% 90% at 80% 20%,#4e1a1f 0%,#2a0e12 55%,#1d0a0d 100%);box-shadow:0 16px 30px rgba(35,13,16,.35);color:#f6eedd;padding:20px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.kc::before{content:"";position:absolute;inset:11px;border:1px dashed rgba(246,238,221,.2);border-radius:18px}
.kc .cap{font-size:10px;color:rgba(246,238,221,.6);letter-spacing:.14em;font-weight:500}
.kc h3{font-size:22px;font-weight:500;line-height:1.2;margin-top:8px;position:relative}
.kc .pg{margin-top:16px;height:8px;border-radius:99px;background:rgba(246,238,221,.15);overflow:hidden;position:relative}.kc .pg i{display:block;height:100%;background:linear-gradient(90deg,#d9ae5c,#f0d28a);border-radius:99px}
.kc .stamps{position:absolute;right:26px;top:26px;display:flex;gap:6px}
.menu{margin-top:22px;border-top:1px solid var(--border)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:58px;border-bottom:1px solid var(--border);font-weight:600;font-size:14.5px;color:var(--ink);text-align:left}
.menu button svg:first-child{color:var(--burgundy)}.menu .g{flex:1}
.sup{margin-top:24px;padding:18px 18px 18px;border-radius:22px;background:linear-gradient(#fbf2de,#f7e6c9);border:1px solid var(--border)}
.sup h3{font-size:16.5px;font-weight:700}
.sup button{margin-top:14px;padding:16px 12px;border-radius:12px;background:#4e1a1d;color:#f6eedd;font-size:14.5px}
/* tabbar */
.tabbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(410px,calc(100% - 20px));z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:24px;background:rgba(248,233,210,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:0 10px 30px rgba(43,16,18,.2)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:17px;font-size:12px;font-weight:500;color:var(--text-2)}
.tabbar a.on{background:linear-gradient(#651e20,#4a1517);color:#fff;font-weight:600;box-shadow:0 5px 12px rgba(58,16,19,.35)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:none}
.sheet-wrap.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(25,10,12,.5);animation:fade .25s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;max-height:92vh;overflow-y:auto;background:var(--paper-100);border-radius:28px 28px 0 0;padding:20px 16px 28px;animation:up .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.sh-h h2{font-size:22px;font-weight:700}
.x{width:48px;height:48px;border-radius:50%;background:#e6d6c8;display:grid;place-items:center;flex:none;color:var(--ink)}
.tbls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbls button{display:flex;justify-content:space-between;align-items:center;padding:0 12px;height:52px;border-radius:12px;background:linear-gradient(#fbf0da,#f7e6c9);border:1.5px solid rgba(86,26,27,.15);font-weight:700;font-size:12.5px;text-align:left}
.tbls button small{font-weight:500;color:var(--text-2);font-size:12px}
.tbls button.on{background:#e8d7c8;border-color:var(--burgundy)}
.tview{position:relative;margin-top:14px;height:300px;border-radius:20px;overflow:hidden;background:radial-gradient(90% 90% at 50% 40%,#58191f,#2e0f14 85%)}
.tov{position:absolute;left:15%;width:70%;top:21%;height:46%;border-radius:999px;background:#7a1d24;border:7px solid #8a3a40;box-shadow:inset 0 0 0 3px #5a1519,0 6px 14px rgba(0,0,0,.35)}
.tov::before{content:"";position:absolute;inset:9px;border-radius:999px;border:1.5px solid rgba(246,214,214,.35)}
.tov::after{content:"";position:absolute;inset:15px;border-radius:999px;border:1px solid rgba(246,214,214,.22)}
.tnum{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(35,13,16,.75);display:grid;place-items:center;color:#f6eedd;font-size:30px;font-weight:300;z-index:2}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;z-index:3}
.gear{position:relative;width:36px;height:36px;display:grid;place-items:center}
.gear svg{position:absolute;inset:0}
.gear span{position:relative;font-size:13px;font-weight:700;color:#8a6a58}
.seat .av{width:34px;height:34px;font-size:12px;border:2px solid #f0e3cc}
.seat .bg{position:absolute;right:20px;bottom:12px;min-width:15px;height:15px;border-radius:99px;background:#fbf3df;color:var(--ink);font-size:9.5px;font-weight:700;display:grid;place-items:center;border:1px solid #2e0f14;padding:0 3px}
.seat .nm{font-size:11px;color:#f6eedd;margin-top:2px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dealer{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;padding:8px 22px 8px 8px;border-radius:14px;background:#fbf3df;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.dealer i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#851c2d;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.dealer small{display:block;font-size:10.5px;font-weight:700;color:var(--wine);letter-spacing:.06em}.dealer b{font-size:12.5px;font-weight:600}
/* forms */
.fl{display:block;font-size:14px;color:var(--text-2);margin:14px 0 6px}
.inp{position:relative;display:flex;align-items:center;gap:8px}
.inp input,.inp textarea{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:16px;border:1.5px solid rgba(86,26,27,.22);background:#f3e4c7;font-size:17px;outline:none}
.inp textarea{height:110px;padding:14px 16px;resize:none;font-size:16px}
.inp input:focus,.inp textarea:focus{border-color:var(--wine)}
.inp input[readonly]{background:var(--paper-100);border-color:var(--border-soft);color:#8a7a72}
.inp .cl{width:44px;height:44px;border-radius:50%;background:#e6d6c8;display:grid;place-items:center;flex:none;color:var(--text-2)}
.hint{font-size:10.5px;color:var(--text-2);margin-top:5px}
.photo{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:linear-gradient(#fbf2de,#f6e8cd);border:1px solid var(--border);flex-wrap:wrap}
.photo .btn-w{display:inline-flex;align-items:center;gap:8px;background:#fffaf0;border-radius:14px;padding:14px 16px;font-weight:600;font-size:13.5px;box-shadow:0 2px 8px rgba(43,16,18,.1)}
.photo p{font-size:11.5px;color:var(--text-2);flex-basis:100%;margin-top:-2px;padding-left:76px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:var(--burgundy);color:#fff;font-weight:600;font-size:16px;margin-top:16px}
.sbtn.wine{background:#8d3640}.sbtn.soft{background:#c4857f;color:#fbe9e3}
.lm{padding:18px;border-radius:22px;background:linear-gradient(#fbf2de,#f7e6c9);border:1px solid var(--border);margin-bottom:14px}
.lm .h{display:flex;align-items:center;gap:14px}.lm .h svg{color:var(--wine);flex:none}
.lm b{display:block;font-size:16px;font-weight:700}.lm small{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.3}
.lm .inp{margin-top:14px}.lm .inp input{height:48px;font-size:16px}
.foot{font-size:12.5px;color:var(--text-2);text-align:center;padding:4px 20px;line-height:1.4}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.conf>div{padding:14px;border-radius:16px;background:var(--bg-inset);border:1px solid var(--border)}
.conf small{display:block;font-size:12px;color:var(--text-2)}.conf b{display:block;font-size:16px;margin-top:6px}
.nstat{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:#e6e4d2;margin-bottom:12px}
.nstat b{display:block;font-size:14.5px}.nstat small{font-size:12px;color:var(--text-2)}
.nstat.un{background:#f1dcc4}
.nstat svg{color:var(--success)}
.ngh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-2);text-transform:uppercase;margin:14px 2px 8px}
.ni{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;background:linear-gradient(#fbf2de,#f5e6ca);border:1px solid var(--border);margin-bottom:8px}
.ni.rd{background:transparent;border-color:var(--border-soft);opacity:.75}
.ni .ico{width:38px;height:38px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;flex:none}
.ni.rd .ico{background:var(--paper-300);color:var(--burgundy)}
.ni b{display:block;font-size:14.5px}.ni small{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.35}
.vote{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:18px;border:1.5px solid var(--border);background:linear-gradient(#fbf2de,#f5e6ca);margin-bottom:10px;text-align:left;font-weight:600;font-size:15.5px}
.vote.on{border-color:var(--burgundy);background:#e8d7c8}
.vote .rad{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--paper-400)}.vote.on .rad{border:6px solid var(--burgundy)}
.pubp{text-align:center;padding:4px 0 6px}.pubp .av{margin:14px auto 0}.pubp h3{font-size:26px;font-weight:600;margin-top:12px}
.pubp .rt{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:99px;background:var(--bg-inset);font-weight:600;font-size:14px}
.seas div{display:flex;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--border);font-size:15px}.seas div b{font-weight:700}
.okc{text-align:center;padding:20px 10px}.okc .ck{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center}
.okc h3{font-size:21px}.okc p{color:var(--text-2);font-size:14px;margin-top:6px}
/* toast */
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);z-index:200;background:#2b1012;color:#fffaf0;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* splash */
.splash{position:fixed;inset:0;z-index:300;background:#f3e9d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s;color:var(--burgundy)}
.splash.off{opacity:0;pointer-events:none}
.splash b{letter-spacing:.2em;font-size:15px;font-weight:600}.splash span{font-size:14px;color:var(--text-3);margin-top:8px}
/* welcome */
.wel{padding:34px 20px 40px}
.wel .lg{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--burgundy)}
.wel h1{font-size:28px;font-weight:600;margin-top:26px;line-height:1.15}
.age{display:flex;gap:12px;padding:14px;border-radius:16px;background:#efdcc0;border:1px solid var(--border);margin-top:18px;font-size:13px;color:var(--text-2);line-height:1.4}
.age b{display:block;color:var(--ink);font-size:14px}.age svg{color:var(--wine);flex:none}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer;line-height:1.35}
.chk input{display:none}.chk i{width:24px;height:24px;border-radius:8px;border:2px solid var(--paper-400);flex:none;display:grid;place-items:center;color:transparent;background:#f3e4c7}
.chk input:checked+i{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
/* demo */
.demo-b{position:fixed;top:63px;left:max(4px,calc(50% - 213px));z-index:60;opacity:.6;padding:3px 8px;border-radius:99px;background:rgba(43,16,18,.55);color:#fff;font-size:10px;font-weight:600;backdrop-filter:blur(6px);display:flex;gap:5px;align-items:center}
.dm{margin-bottom:14px}.dm .l{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.dm .o{display:flex;gap:6px}.dm .o button{flex:1;padding:12px 6px;border-radius:12px;background:var(--bg-inset);font-weight:600;font-size:13.5px}
.dm .o button.on{background:var(--burgundy);color:#fff}
.skel{margin:40px 0;border:2px dashed var(--paper-400);border-radius:24px;padding:60px 20px;text-align:center;color:var(--text-2);font-size:15px}

/* ===== адаптив ===== */
.dmb{display:grid}.side{display:none}
.tgrid .tcard{margin-bottom:14px}
@media(hover:hover){
 .tcard,.btn,.cta,.pr-row,.hrow,.arch li,.pill,.btn-light,.menu button,.sbtn,.ni,.vote{transition:transform .18s,box-shadow .18s,background-color .18s,filter .18s}
 .tcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(43,16,18,.16)}
 .btn:hover,.cta:hover,.sbtn:hover{filter:brightness(1.08)}.btn-light:hover,.pill:hover{transform:translateY(-1px)}
 .pr-row:hover,.hrow:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(43,16,18,.12)}
 .arch li:hover{background:rgba(86,26,27,.05)}.menu button:hover{background:rgba(86,26,27,.05)}
 .seg button:not(.on):hover,.per button:not(.on):hover,.seg2 button:not(.on):hover{background:rgba(86,26,27,.07)}
 .tabbar a:not(.on):hover{background:rgba(86,26,27,.07)}
}

let sheetKind=null;
function sheet(title,body,kind){
  sheetKind=kind||title;
  $('#sheet').innerHTML=`<div class="sh-h"><h2>${title}</h2><button class="x" data-a="closeSheet" aria-label="Закрыть">${ic('x',22,2)}</button></div>${body}`;
  $('#sheet').className='sheet'+(sheetKind==='tables'?' wide':'');
  $('#sheetW').classList.add('on');$('#sheet').scrollTop=0;document.body.style.overflow='hidden';
  if(!shOpen){try{history.pushState({sh:1},'')}catch(e){}shOpen=true;}
}
let shOpen=false;
function hideSheet(){$('#sheetW').classList.remove('on');sheetKind=null;shOpen=false;document.body.style.overflow='';}
function closeSheet(){if(!$('#sheetW').classList.contains('on'))return;if(shOpen){shOpen=false;try{history.back();return}catch(e){}}hideSheet();}
window.addEventListener('popstate',()=>{if($('#sheetW').classList.contains('on'))hideSheet();});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200);}

function seatMarkup(tn){
  const pos={1:[30,72],2:[14,60],3:[10,37],4:[21,19],5:[40,15],6:[60,14],7:[79,18],8:[90,37],9:[86,60],10:[70,72]};
  const occ=SEATED[tn]||{};
  let h=`<div class="tov"></div><div class="tnum">${tn}</div>`;
  for(let i=1;i<=10;i++){
    const [x,y]=pos[i];const nm=occ[i];
    h+=`<div class="seat" style="left:${x}%;top:${y}%">`+(nm
      ?`${av(nm,34)}<span class="bg">${i}</span><span class="nm">${esc(nm)}</span>`
      :`<span class="gear"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="#d8c9b0" stroke="#d8c9b0" stroke-width="6" stroke-dasharray="3.2 2.6"/></svg><span>${i}</span></span>`)+`</div>`;
  }
  return h+`<div class="dealer"><i>Д</i><div><small>ДИЛЕР</small><b>Не назначен</b></div></div>`;
}
function tablesBody(){
  const tn=S.tbl;
  return `<div class="tbls">${TCNT.map((c,i)=>`<button class="${tn===i+1?'on':''}" data-a="tbl" data-v="${i+1}">Стол ${i+1}<small>${c}/10</small></button>`).join('')}</div>
   <div class="tview">${seatMarkup(tn)}</div>
   <h2 class="s" style="margin:28px 6px 6px;font-size:21px">Bounty за столом</h2>${feedList(tn)}`;
}
function openTables(){sheet('Столы турнира','<div id="tb">'+tablesBody()+'</div>','tables');}
function openReg(id){
  const t=tById(id);
  sheet('Запись на турнир',`<div class="cap">Проверьте условия</div><h3 style="font-size:24px;text-transform:uppercase;margin-top:8px;font-weight:700">${esc(t.name)}</h3><p class="sub" style="margin-top:4px;color:var(--wine);font-weight:600">${esc(t.date)}</p>
  <div class="conf"><div><small>Формат</small><b>${t.kind==='bounty'?'Bounty':'Классика'}</b></div><div><small>Орг. взнос</small><b>${t.fee}</b></div><div><small>Стартовый стек</small><b>${t.stack}</b></div><div><small>Регистрации</small><b>${regN(t)} из ${t.cap}</b></div></div>
  <p class="sub" style="margin-top:0;line-height:1.45">После подтверждения турнир появится на главной. Запись можно отменить до check-in.</p>
  <button class="sbtn" data-a="regOk" data-id="${id}" style="height:54px">Подтвердить запись</button>`,'reg');
}
function openNotifs(){
  const list=S.demo.notifs?NOTIFS:[];const un=list.filter(n=>!S.read[n.id]);const rd=list.filter(n=>S.read[n.id]);
  const item=n=>`<button class="ni ${S.read[n.id]?'rd':''}" data-a="notif" data-id="${n.id}"><span class="ico">${ic(n.ic,18,1.8)}</span><div><b>${esc(n.t)}</b><small>${esc(n.s)}</small></div></button>`;
  let h=un.length?`<div class="nstat un"><span style="color:var(--wine)">${ic('bell',22)}</span><div><b>Не прочитано (${un.length})</b><small>Нажмите на уведомление, чтобы открыть</small></div></div>`
    :`<div class="nstat">${ic('check',22,2.2)}<div><b>Всё прочитано</b><small>Новые уведомления появятся здесь</small></div></div>`;
  if(un.length)h+=`<div class="ngh">Новые</div>`+un.map(item).join('');
  if(rd.length)h+=`<div class="ngh">Прочитанные</div>`+rd.map(item).join('');
  if(!list.length)h+=`<div class="empty" style="padding-top:34px"><div style="color:var(--burgundy)">${ic('bell',30,1.6)}</div><h3 style="font-size:15px;margin-top:10px">Уведомлений пока нет</h3></div>`;
  sheet('Уведомления',h,'notifs');
}
let voteSel=-1;
function openVote(){
  voteSel=-1;
  sheet('Оценка вечера',`<p class="sub" style="margin:-6px 0 16px">Выберите одного дилера</p>${DEALERS.map((d,i)=>`<button class="vote" data-a="vsel" data-v="${i}">${av(d,40)}${d}<span class="rad"></span></button>`).join('')}<button class="sbtn soft" id="vbtn" data-a="vok">Проголосовать</button>`,'vote');
}
function openPlayer(n){
  const p=PLAYERS.find(x=>x.name===n)||PLAYERS[0];
  sheet('Профиль игрока',`<div class="pubp"><div class="cap">Игрок ${BRAND}</div>${av(p.name,96)}<h3>${esc(p.name)}</h3><span class="rt">Рейтинг ${fmt(p.pts)}</span><p class="sub">${p.vis} клубных визитов</p></div>
   <div class="ngh" style="margin-top:20px">По сезонам</div><div class="seas">${SEASONS.map((s,i)=>`<div><span>${s[0]}</span><b>${i===0?fmt(p.pts):fmt(Math.round(p.pts*(1-i*.22)))} оч.</b></div>`).join('')}</div>`,'player');
}
function fld(id,label,val,o={}){
  return `<label class="fl">${label}</label><div class="inp"><input id="${id}" value="${esc(val)}" ${o.ro?'readonly':''} ${o.ph?`placeholder="${o.ph}"`:''}>${o.ro?'':`<button class="cl" data-a="clr" data-t="${id}" aria-label="Очистить">${ic('x',16,2)}</button>`}</div>${o.hint?`<div class="hint">${o.hint}</div>`:''}`;
}
function openPersonal(){
  const p=S.profile;
  sheet('Личные данные',`<div class="photo">${avMe(64)}<button class="btn-w" data-a="photo">${ic('cam',20)} Выбрать фото</button><p>Квадратное фото будет лучше смотреться за столом.</p></div>
  ${fld('f1','ФИО',p.fio)}${fld('f2','Клубный ник',p.nick,{hint:'Именно его увидят дилер и другие игроки.'})}
  <label class="fl">Ник в Telegram</label><div class="inp"><input value="${esc(p.tg)}" readonly></div>
  ${fld('f4','Телефон',p.phone)}
  <label class="fl">Email</label><div class="inp"><input value="${esc(p.email)}" readonly></div><div class="hint">Почта изменяется в разделе «Способы входа» после подтверждения кодом.</div>
  <button class="sbtn" data-a="savep" style="height:54px">Сохранить</button>`,'personal');
}
function openLogin(step){
  const p=S.profile;
  const mail=p.emailOk?`<div class="h">${ic('mail',24)}<div><b>Электронная почта</b><small>Подключена · ${esc(p.email)}</small></div></div>`
   :`<div class="h">${ic('mail',24)}<div><b>Электронная почта</b><small>Не подключена</small></div></div>
     <div class="inp"><input id="em" value="${esc(p.email)}" ${step?'readonly':''}>${step?'':`<button class="cl" data-a="clr" data-t="em">${ic('x',16,2)}</button>`}</div>
     ${step?`<div class="inp" style="margin-top:10px"><input id="cd" placeholder="Код из письма" inputmode="numeric" maxlength="4"></div><button class="sbtn" data-a="code" style="height:48px">Подтвердить код</button>`:`<button class="sbtn soft" data-a="mailok" style="height:48px">Подтвердить почту</button>`}`;
  const tg=p.tgOk?`<div class="h">${ic('send',24)}<div><b>Telegram</b><small>Подключён · ${esc(p.tg)}</small></div></div>`:`<div class="h">${ic('send',24)}<div><b>Telegram</b><small>Не подключён</small></div></div>`;
  sheet('Способы входа',`<div class="lm">${mail}</div><div class="lm" ${p.tgOk?'':'data-a="tgok" style="cursor:pointer"'}>${tg}</div>
  <div class="lm"><div class="h">${ic('shield',24)}<div><b>Удаление аккаунта</b><small>Личные данные будут удалены, история клуба — обезличена</small></div></div><button class="sbtn wine" data-a="del" style="height:48px">${ic('trash',20)} Удалить аккаунт</button></div>
  <p class="foot">Оба способа входа открывают один профиль, рейтинг и историю турниров.</p>`,'login');
}
function openSupport(){
  sheet('Поддержка',`<label class="fl" style="margin-top:0">Что произошло?</label><div class="inp"><textarea id="sup" placeholder="Опишите проблему"></textarea></div><button class="sbtn" data-a="supok" style="height:54px">Отправить обращение</button>`,'support');
}
function openDemo(){
  const d=S.demo;const o=(k,v,l)=>`<button class="${d[k]===v?'on':''}" data-a="dm" data-k="${k}" data-v="${v}">${l}</button>`;
  sheet('Демо-меню',`<div class="dm"><div class="l">Live-турнир</div><div class="o">${o('live','run','Идёт')}${o('live','pause','Пауза')}${o('live','none','Нет')}</div></div>
   <div class="dm"><div class="l">Есть история</div><div class="o">${o('history',true,'Да')}${o('history',false,'Нет')}</div></div>
   <div class="dm"><div class="l">Есть уведомления</div><div class="o">${o('notifs',true,'Да')}${o('notifs',false,'Нет')}</div></div>
   <div class="dm"><div class="l">Онбординг</div><div class="o"><button data-a="open" data-h="#/welcome">Открыть «Первый вход»</button></div></div>
   <div class="dm"><div class="o"><button data-a="reset" style="background:#e9c9c5">Сбросить данные</button></div></div>`,'demo');
}

/* ================= КАРКАС ================= */
function chrome(route){
  const un=S.demo.notifs&&NOTIFS.some(n=>!S.read[n.id]);
  $('#hdr').innerHTML=`<a href="#/home" class="logo" aria-label="${BRAND}">${logoSvg(28,'#561a1b')}<span>${BRAND}</span></a>
   <div class="hdr-r"><button class="bell dmb" data-a="demo" aria-label="Демо-меню">${ic('sl',22,1.7)}</button><button class="bell" data-a="notifs" aria-label="Уведомления">${ic('bell',24,1.7)}${un?'<i></i>':''}</button><a href="#/profile" class="hav">${avMe(36)}</a></div>`;
  $('#side').innerHTML=`<a href="#/home" class="slogo">${logoSvg(36,'#561a1b')}<b>${BRAND}</b></a><nav class="snav">${[['home','Главная','home'],['tournaments','Турниры','cal'],['rating','Рейтинг','trophy'],['history','История','hist'],['profile','Профиль','user']].map(t=>`<a href="#/${t[0]}" class="${route===t[0]?'on':''}">${ic(t[2],22,1.7)}<span>${t[1]}</span></a>`).join('')}</nav>
   <div class="sfoot"><button class="sdemo" data-a="demo">${ic('sl',18,1.8)} Демо-меню</button><a href="#/profile" class="smini">${avMe(40)}<div><b>${esc(S.profile.nick)}</b><small>Профиль</small></div></a></div>`;
  const tabs=[['home','Главная','home'],['tournaments','Турниры','cal'],['rating','Рейтинг','trophy'],['history','История','hist'],['profile','Профиль','user']];
  $('#tabbar').innerHTML=tabs.map(t=>`<a href="#/${t[0]}" class="${route===t[0]?'on':''}">${ic(t[2],25,1.7)}<span>${t[1]}</span></a>`).join('');
  const on=route!=='welcome';
  $('#hdr').style.display=$('#tabbar').style.display=$('#side').style.display=on?'':'none';
  document.body.classList.toggle('nochrome',!on);
}
let tick=null;
function render(keep){
  if(keep!==true)hideSheet();
  const h=(location.hash||'#/home').replace(/^#\/?/,'');const p=h.split('/').filter(Boolean);
  let route=p[0]||'home',html;
  if(route==='tournaments'){
    if(p[1]==='archive')html=p[2]?V.archiveItem(p[2]):V.archive();
    else if(p[1])html=V.tournament(p[1],p[2]||'about');
    else html=V.tournaments();
  }else if(route==='history')html=p[1]?V.historyItem(p[1]):V.history();
  else if(V[route])html=V[route]();
  else{route='home';html=V.home();}
  chrome(route);
  $('#app').innerHTML=html;
  window.scrollTo(0,0);
  startTick();
}
function startTick(){
  clearInterval(tick);const el=$('#liveTm');if(!el||S.demo.live==='none')return;
  let sec=S.demo.live==='pause'?357:1062;
  tick=setInterval(()=>{const e=$('#liveTm');if(!e){clearInterval(tick);return;}sec=sec>0?sec-1:(S.demo.live==='pause'?357:1062);
    e.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');},1000);
}
function rerenderKeep(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* ================= СОБЫТИЯ ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='open'){e.stopPropagation();const h=el.dataset.h;hideSheet();if(location.hash===h)render();else location.hash=h;return;}
  if(el.tagName==='INPUT')return;
  switch(a){
    case 'closeSheet':closeSheet();break;
    case 'tables':openTables();break;
    case 'tbl':S.tbl=+el.dataset.v;save();$('#tb').innerHTML=tablesBody();break;
    case 'reg':e.stopPropagation();openReg(el.dataset.id);break;
    case 'regOk':S.reg[el.dataset.id]=true;save();closeSheet();toast('Регистрация подтверждена');rerenderKeep();break;
    case 'unreg':delete S.reg[el.dataset.id];save();toast('Запись отменена');rerenderKeep();break;
    case 'notifs':openNotifs();break;
    case 'notif':{const n=NOTIFS.find(x=>x.id===el.dataset.id);S.read[n.id]=true;save();chrome((location.hash.split('/')[1])||'home');if(n.vote)openVote();else{hideSheet();location.hash=n.go;}break;}
    case 'vsel':voteSel=+el.dataset.v;$('#sheet').querySelectorAll('.vote').forEach((b,i)=>b.classList.toggle('on',i===voteSel));$('#vbtn').classList.remove('soft');break;
    case 'vok':if(voteSel<0){toast('Выберите дилера');break;}S.voted=true;save();sheet('Оценка вечера',`<div class="okc"><div class="ck">${ic('check',34,2.5)}</div><h3>Спасибо! Ваш голос учтён.</h3><p>Вы выбрали: ${DEALERS[voteSel]}</p></div><button class="sbtn" data-a="closeSheet">Закрыть</button>`,'vote');break;
    case 'player':openPlayer(el.dataset.n);break;
    case 'rt':S.rt=el.dataset.v;save();rerenderKeep();break;
    case 'rp':S.rp=el.dataset.v;save();rerenderKeep();break;
    case 'personal':openPersonal();break;
    case 'login':openLogin(0);break;
    case 'support':openSupport();break;
    case 'supok':sheet('Поддержка',`<div class="okc"><div class="ck">${ic('check',34,2.5)}</div><h3>Обращение принято</h3><p>Мы ответим в Telegram в течение дня.</p></div><button class="sbtn" data-a="closeSheet">Закрыть</button>`,'support');break;
    case 'clr':{const i=document.getElementById(el.dataset.t);if(i){i.value='';i.focus();}break;}
    case 'photo':toast('Выбор фото недоступен в прототипе');break;
    case 'savep':{const v=id=>document.getElementById(id).value.trim();if(!v('f2')){toast('Укажите клубный ник');break;}
      Object.assign(S.profile,{fio:v('f1'),nick:v('f2'),phone:v('f4')});save();closeSheet();toast('Профиль обновлён');rerenderKeep();break;}
    case 'mailok':{const v=document.getElementById('em').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){toast('Введите корректный email');break;}S.profile.email=v;openLogin(1);break;}
    case 'code':{const c=document.getElementById('cd').value.trim();if(!/^\d{4}$/.test(c)){toast('Введите 4-значный код');break;}S.profile.emailOk=true;save();openLogin(0);toast('Почта подтверждена');break;}
    case 'tgok':S.profile.tgOk=true;save();openLogin(0);toast('Telegram подключён');break;
    case 'del':if(confirm('Удалить аккаунт? В прототипе данные не удаляются.'))toast('Запрос на удаление принят (демо)');break;
    case 'demo':openDemo();break;
    case 'dm':{const k=el.dataset.k;let v=el.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;S.demo[k]=v;save();render(true);openDemo();break;}
    case 'reset':S=DEF();save();render();toast('Данные сброшены');break;
    case 'wchk':setTimeout(()=>{const ok=[...document.querySelectorAll('.wc')].every(c=>c.checked);$('#wfin').classList.toggle('soft',!ok);},0);break;
    case 'wfin':if(document.querySelector('#wfin.soft'))toast('Отметьте все пункты');else{toast('Добро пожаловать в '+BRAND);location.hash='#/home';}break;
  }
});
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ================= СТАРТ ================= */
$('#splash').innerHTML=`${logoSvg(88,'#561a1b')}<b>${BRAND}</b><span>Загружаем ${BRAND}…</span>`;
render();
setTimeout(()=>{$('#splash').classList.add('off');setTimeout(()=>$('#splash').remove(),500)},800);
</script>
</body>
</html>
